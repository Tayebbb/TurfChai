<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your profile · TurfChai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/turfchai.css">
</head>
<body>
<header class="topbar glass">
  <div class="topbar-inner">
    <a class="brand" href="landing.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 2.5C9.6 2.5 4.5 7.6 4.5 14c0 8.2 11.5 15.5 11.5 15.5S27.5 22.2 27.5 14C27.5 7.6 22.4 2.5 16 2.5z" fill="var(--brand)"/><rect x="10" y="8.5" width="12" height="11" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="16" y1="8.5" x2="16" y2="19.5" stroke="#fff" stroke-width="1.5"/><circle cx="16" cy="14" r="2.2" fill="none" stroke="#fff" stroke-width="1.5"/></svg>TurfChai</a>
    <div class="spacer"></div>
    <button class="icon-btn" data-toggle-theme aria-label="Toggle theme">🌙</button>
    <a class="btn btn-tertiary" href="home.html">Skip for now</a>
  </div>
</header>

<main class="wrap-form" style="padding-top:40px;padding-bottom:64px">
  <div class="stepper" aria-label="Onboarding progress">
    <div class="step done"><span class="dot">✓</span>Verify</div>
    <div class="step-line done"></div>
    <div class="step on"><span class="dot">2</span>About you</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot">3</span>Play style</div>
  </div>

  <div class="card" style="padding:24px">
    <h2 style="font-size:20px">Quick setup — 30 seconds</h2>
    <p class="subtle" style="margin-bottom:18px">We use this to show the right venues and games first. You can change it anytime.</p>

    <div class="field"><label for="on-name">Your name</label><input class="input" id="on-name" value="Rafiul Karim"></div>
    <div class="field">
      <label for="on-loc">Home area</label>
      <select class="select" id="on-loc">
        <option>Dhanmondi</option><option>Mohammadpur</option><option>Mirpur DOHS</option>
        <option>Uttara</option><option>Banani</option><option>Baridhara</option><option>Bashundhara R/A</option>
      </select>
      <span class="hint">📍 Detected from your location — tap to change</span>
    </div>

    <div class="field">
      <label>Sports you play</label>
      <div class="row-wrap">
        <button class="chip on" data-filter>⚽ Football</button>
        <button class="chip on" data-filter>🏏 Cricket</button>
        <button class="chip" data-filter>🏸 Badminton</button>
        <button class="chip" data-filter>🏀 Basketball</button>
        <button class="chip" data-filter>🎾 Futsal</button>
      </div>
    </div>

    <div class="field">
      <label>When do you usually play?</label>
      <div class="row-wrap">
        <button class="chip" data-filter>Morning</button>
        <button class="chip" data-filter>Afternoon</button>
        <button class="chip on" data-filter>Evening</button>
        <button class="chip on" data-filter>Late night</button>
        <button class="chip on" data-filter>Weekends</button>
      </div>
    </div>

    <div class="field">
      <label>Skill level</label>
      <div class="row-wrap">
        <button class="chip" data-filter>Beginner</button>
        <button class="chip on" data-filter>Intermediate</button>
        <button class="chip" data-filter>Advanced</button>
      </div>
    </div>

    <div class="field">
      <label>How do you play?</label>
      <div class="grid2">
        <label class="panel row" style="cursor:pointer"><input type="radio" name="role" checked style="accent-color:var(--brand);width:18px;height:18px"><span><b>Team captain</b><br><span class="subtle">I book for my team and split payments</span></span></label>
        <label class="panel row" style="cursor:pointer"><input type="radio" name="role" style="accent-color:var(--brand);width:18px;height:18px"><span><b>Solo player</b><br><span class="subtle">I join open games as a free agent</span></span></label>
      </div>
    </div>

    <a class="btn btn-primary btn-lg btn-block" href="home.html">Start playing →</a>
  </div>
</main>
<script src="../js/turfchai.js"></script>
</body>
</html>
