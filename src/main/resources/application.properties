spring.application.name=turfchai

# ── AI platform ──────────────────────────────────────────────────────────────
# API key comes from the environment; never commit real keys.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-2.0-flash
app.ai.gemini.embedding-model=text-embedding-004
app.ai.rag.chunk-size=800
app.ai.rag.chunk-overlap=120
app.ai.rag.top-k=4
app.ai.rag.min-score=0.30
app.ai.memory.max-messages=30
app.ai.memory.max-sessions=1000
app.ai.agent.max-tool-iterations=4
