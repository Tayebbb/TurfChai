# TurfChai application configuration
#
# DB_* / JWT_* values resolve from:
#   1. OS environment variables (highest priority — used in prod/CI)
#   2. the local `.env` file (imported below, gitignored — dev only)
spring.application.name=turfchai

# Load the repo-root `.env` when present (dev convenience). `optional:` keeps
# startup working when the file is missing (e.g. CI) — env vars still apply.
spring.config.import=optional:file:./.env[.properties]

# --- PostgreSQL (Spring Data JPA) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:turfchai}
spring.datasource.username=${DB_USER:turfchai}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool — conservative defaults; tune once prod metrics exist.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=TurfChaiHikariPool

# --- JPA / Hibernate ---
# Schema is managed by Flyway migrations (next step); Hibernate never auto-DDLs.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
