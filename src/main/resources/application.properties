spring.application.name=turfchai

# Load local secrets from a git-ignored .env file at the project root
# (KEY=VALUE lines). Optional: falls back to real environment variables.
spring.config.import=optional:file:.env[.properties]

# ── Database ─────────────────────────────────────────────────────────────────
# No entities/repositories exist yet, so JPA + datasource auto-config is
# disabled to let the app boot. Remove these excludes (and set
# spring.datasource.url/username/password) when the persistence layer lands.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration

# ── AI platform ──────────────────────────────────────────────────────────────────────────────
# API keys come from .env / the environment; never commit real keys.
# OpenRouter is the primary LLM; Hugging Face is the fallback.
app.ai.primary-provider=openrouter
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
# Free tool-calling models ordered by measured latency (ling ~1-2s);
# fallback-models are OpenRouter routing alternates (max 3 total).
app.ai.openrouter.model=inclusionai/ling-3.0-flash:free
app.ai.openrouter.fallback-models=nvidia/nemotron-3-nano-30b-a3b:free,google/gemma-4-26b-a4b-it:free
app.ai.openrouter.temperature=0.3
app.ai.openrouter.top-p=0.9
# Shorter replies stream back faster and cost fewer credits
app.ai.openrouter.max-tokens=450
# Route to the fastest upstream provider serving the model
app.ai.openrouter.latency-routing=true
app.ai.huggingface.api-key=${HF_API_KEY:}
app.ai.huggingface.model=meta-llama/Llama-3.3-70B-Instruct
app.ai.huggingface.temperature=0.3
app.ai.huggingface.top-p=0.9
app.ai.huggingface.max-tokens=450
app.ai.rag.chunk-size=800
app.ai.rag.chunk-overlap=120
app.ai.rag.top-k=3
# Low threshold: hashing (lexical) fallback embeddings score lower than
# semantic ones; top-k already caps how much context is injected.
app.ai.rag.min-score=0.05
# 12 messages (6 exchanges) covers a full booking flow at half the tokens
app.ai.memory.max-messages=12
app.ai.memory.max-sessions=1000
app.ai.agent.max-tool-iterations=4
# Skip a quota-exhausted primary LLM for this long before retrying it
app.ai.agent.primary-cooldown-seconds=60
