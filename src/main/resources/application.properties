spring.application.name=turfchai

# Cloudinary — set CLOUDINARY_URL in environment or .env
cloudinary.url=${CLOUDINARY_URL}

# Media upload constraints
media.upload-folder=${UPLOAD_PICTURE:TurfChai}
media.max-file-size-mb=5

# Spring multipart (allow up to 10 MB for the request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
