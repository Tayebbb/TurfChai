spring.application.name=turfchai

# Server Port (Render provides PORT, defaults to 8080 for local dev)
server.port=${PORT:8080}

# Load local secrets from a git-ignored .env file at the project root
spring.config.import=optional:file:.env[.properties]
# ── Cloudinary & Media Uploads ────────────────────────────────────────────────
# Optional: uploads are rejected at call time when CLOUDINARY_URL is unset.
cloudinary.url=${CLOUDINARY_URL:}

# Media upload constraints
media.upload-folder=${UPLOAD_PICTURE:turfchai}
media.max-file-size-mb=5

# Spring multipart (allow up to 10 MB for the request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Database Configuration (Environment variable driven PostgreSQL) ──────────
# Local zero-setup development: run with --spring.profiles.active=dev to use
# in-memory H2 + demo seeders instead (see application-dev.properties).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turfchai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# HikariCP pool — conservative defaults; tune once prod metrics exist.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=TurfChaiHikariPool

# JPA & Hibernate properties
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway migrations (versioned schema; source of truth: db/migration) ─────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false

# ── JWT Authentication ────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:local-dev-secret-akif-change-before-prod-must-be-at-least-32-chars-long}
app.jwt.issuer=${JWT_ISSUER:turfchai}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.otp-ttl-seconds=${OTP_TTL_SECONDS:300}

# Venue-local zone. Kickoff times are stored as local date/time, so gate
# windows are only correct when resolved here rather than in the server's zone.
app.timezone=${APP_TIMEZONE:Asia/Dhaka}

# ── SMTP Mail (2FA OTP delivery) ──────────────────────────────────────────────
# Leave SPRING_MAIL_HOST blank (default) to skip real emails; the OTP is then
# only returned as `devCode`, which keeps the demo flow working with no SMTP.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# When true, the generated OTP is returned in API responses as `devCode`
# (dev/demo convenience). Never expose in production.
app.otp.expose-dev-code=${OTP_EXPOSE_DEV_CODE:true}

# ── Scheduling ────────────────────────────────────────────────────────────────
# Default pool size is 1, which would serialise the slot-hold cleanup job
# against the SSE keep-alive heartbeat: a slow DB sweep would stall heartbeats
# long enough for proxies to drop live streams, and a wide fan-out would delay
# releasing expired holds.
spring.task.scheduling.pool.size=3

# ── CORS Configuration ────────────────────────────────────────────────────────
app.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── AI Platform Configuration ─────────────────────────────────────────────────
app.ai.primary-provider=openrouter
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=inclusionai/ling-3.0-flash:free
app.ai.openrouter.fallback-models=nvidia/nemotron-3-nano-30b-a3b:free,google/gemma-4-26b-a4b-it:free
app.ai.openrouter.temperature=0.3
app.ai.openrouter.top-p=0.9
app.ai.openrouter.max-tokens=450
app.ai.openrouter.latency-routing=true
app.ai.huggingface.api-key=${HF_API_KEY:}
app.ai.huggingface.model=meta-llama/Llama-3.3-70B-Instruct
app.ai.huggingface.temperature=0.3
app.ai.huggingface.top-p=0.9
app.ai.huggingface.max-tokens=450
app.ai.rag.chunk-size=800
app.ai.rag.chunk-overlap=120
app.ai.rag.top-k=3
app.ai.rag.min-score=0.05
app.ai.memory.max-messages=12
app.ai.memory.max-sessions=1000
app.ai.agent.max-tool-iterations=4
app.ai.agent.primary-cooldown-seconds=60
