# Zero-setup local development: in-memory H2 (PostgreSQL mode), schema from
# Hibernate, demo seeders enabled. Activate with --spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:turfchai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
