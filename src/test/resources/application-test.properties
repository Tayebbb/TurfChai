spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
# Flyway baseline targets PostgreSQL; the test suite uses H2 create-drop.
spring.flyway.enabled=false

# Deterministic 2FA behavior — never inherit the developer's .env flags.
# Demo mode on (devCode exposed) so challenge tests are stable. Email
# delivery has been removed from the app; the on-screen code is the only channel.
app.otp.expose-dev-code=true
