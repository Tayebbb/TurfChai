# =============================================================================
# TurfChai — local production-profile stack (matches the free-tier cloud setup)
#
# One container now serves both the API and the built React SPA on :8080 —
# the same single-service shape the Dockerfile/Render deploy uses. The
# database is the only other container.
#
#   docker compose up --build          # http://localhost:8080
#
# The legacy split mode (nginx frontend + backend on separate ports) still
# exists; use profiles:
#
#   docker compose --profile split up --build   # frontend :5173, backend :8080
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: turfchai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turfchai}
      POSTGRES_USER: ${POSTGRES_USER:-turfchai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turfchai_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turfchai} -d ${POSTGRES_DB:-turfchai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - turfchai-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turfchai-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-turfchai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-turfchai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-turfchai_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-akif-change-before-prod-must-be-at-least-32-chars-long}
      OTP_EXPOSE_DEV_CODE: "true"
      APP_TIMEZONE: Asia/Dhaka
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - turfchai-network

  # ── Legacy split mode (docker compose --profile split up) ─────────────────
  # The nginx frontend that used to be the default; kept for parity with the
  # old README instructions and for testing CORS behaviour against a separate
  # origin.
  backend:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turfchai-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-turfchai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-turfchai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-turfchai_dev}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-akif-change-before-prod-must-be-at-least-32-chars-long}
      OTP_EXPOSE_DEV_CODE: "true"
      APP_TIMEZONE: Asia/Dhaka
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - turfchai-network

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turfchai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - turfchai-network

volumes:
  postgres_data:
    driver: local

networks:
  turfchai-network:
    driver: bridge
