name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: ./mvnw -B -ntp verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  boot-smoke:
    name: Admin smoke (2FA + RBAC on fresh DB)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turfchai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/turfchai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package application
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start backend
        shell: bash
        run: |
          nohup java -jar target/turfchai-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid
      - name: Run admin smoke test
        shell: bash
        run: ./scripts/ci-smoke.sh
      - name: Show backend log on failure
        if: failure()
        shell: bash
        run: |
          echo '--- app.log (last 80 lines) ---'
          tail -n 80 app.log || true
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          kill "$(cat app.pid)" 2>/dev/null || true
          wait "$(cat app.pid)" 2>/dev/null || true
