# Single-service deployment: one web service runs the jar, which serves BOTH
# the REST API and the built React SPA (see Dockerfile stage 2). This is the
# fix for the Vercel + Render split setup where /admin 404'd — there is no
# second origin, no CORS, and no SPA rewrite to get wrong.
#
# The database is intentionally NOT a Render Postgres: Render's free Postgres
# expires after 30 days. Point DATABASE_URL at a free Neon (or Supabase)
# instance instead — set these in the Render dashboard:
#
#   SPRING_DATASOURCE_URL     jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME  <neon user>
#   SPRING_DATASOURCE_PASSWORD  <neon password>
#   JWT_SECRET                <long random string>
#   OTP_EXPOSE_DEV_CODE       false   (unless demo)
#   SPRING_JPA_HIBERNATE_DDL_AUTO  validate
#   SPRING_FLYWAY_ENABLED    true
services:
  - type: web
    name: turfchai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_EXPOSE_DEV_CODE
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
